<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Genealogía Bíblica · Mapa Geográfico</title>
    <meta name="description" content="Mapa interactivo que muestra los lugares de nacimiento de los personajes de la genealogía bíblica.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- Leaflet MarkerCluster -->
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
    
    <style>
        /* ── Neo-Skeuo Design tokens ──────────────────────────── */
        :root {
            --bg:             #faf6f0; /* Tono gris amarronado lavado extra suave */
            --surface:        #f4f0e8; /* Base de ficha */
            --surface-raised: #f7f6f2; /* Elemento elevado */
            --surface-inset:  #dedad0; /* Superficie hundida */
            --border:         #1a1917; /* Negro tinta lavada */
            --border-subtle:  #7a7870;
            --text:           #1a1917;
            --muted:          #5a5850;
            --subtle:         #8a8880;
            --accent:         #1a1917;
            --accent-bg:      #dedad0;
            --m-dot:          #3b82f6;
            --f-dot:          #e879a0;
            --radius-sm:      0px;
            --radius-md:      4px;
            --radius-lg:      8px;
            --shadow-block:   3px 3px 0px var(--border);
        }
        [data-theme="dark"] {
            --bg:             #403d39; /* Gris pizarra oscuro lavado */
            --surface:        #32302d;
            --surface-raised: #47423b;
            --surface-inset:  #242321;
            --border:         #faf6f0; /* Tinta blanca lavada */
            --border-subtle:  #8a8880;
            --text:           #faf6f0;
            --muted:          #b0ada6;
            --subtle:         #6a6860;
            --accent:         #faf6f0;
            --accent-bg:      #242321;
            --m-dot:          #60a5fa;
            --f-dot:          #f472b6;
            --shadow-block:   3px 3px 0px var(--border);
        }

        /* ── Reset ────────────────────────────────────────────── */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { height: 100%; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            font-size: 13.5px;
            line-height: 1.5;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* Technical Grid */
        .dotted-grid {
            position: absolute;
            inset: 0;
            background-image: radial-gradient(var(--border-subtle) 1px, transparent 1px);
            background-size: 20px 20px;
            opacity: 0.08;
            pointer-events: none;
            z-index: 1;
        }

        /* Spinner */
        #loadingOverlay {
            position: fixed; inset: 0; background: var(--bg);
            display: flex; align-items: center; justify-content: center;
            z-index: 9999; flex-direction: column; gap: 16px;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }
        .spinner {
            width: 36px; height: 36px;
            border: 2px solid var(--border); border-top-color: var(--border-subtle);
            animation: spin .8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── Top bar ──────────────────────────────────────────── */
        .topbar {
            height: 52px;
            min-height: 52px;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 20px;
            background: var(--surface);
            border-bottom: 2px solid var(--border);
            flex-shrink: 0;
            z-index: 50;
        }
        .topbar-brand {
            font-size: 13px; font-weight: 700; color: var(--text);
            display: flex; align-items: center; gap: 8px;
            text-transform: uppercase;
        }
        .topbar-brand-dot { width: 8px; height: 8px; background: var(--text); border: 1px solid var(--bg); border-radius: 50%; }
        .topbar-sep { flex: 1; }
        .topbar-btn {
            display: flex; align-items: center; gap: 5px;
            padding: 5px 11px; font-size: 12px; font-weight: 600;
            color: var(--text); background: var(--surface-raised);
            border: 1px solid var(--border); border-radius: var(--radius-sm);
            cursor: pointer; text-decoration: none; font-family: inherit;
            box-shadow: 2px 2px 0px var(--border);
            transition: transform 0.1s, box-shadow 0.1s;
        }
        .topbar-btn:active, .topbar-btn.active { transform: translate(2px, 2px); box-shadow: none; }
        .topbar-btn svg { width: 13px; height: 13px; fill: currentColor; }

        .topbar-nav-links {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        /* Mobile controls buttons */
        .menu-toggle, .filter-toggle {
            display: none;
            background: var(--surface-raised);
            border: 1px solid var(--border);
            cursor: pointer;
            padding: 6px;
            color: var(--text);
            box-shadow: 1.5px 1.5px 0px var(--border);
        }
        .menu-toggle svg, .filter-toggle svg { width: 18px; height: 18px; fill: currentColor; display: block; }
        .menu-toggle:active, .filter-toggle:active { transform: translate(1px, 1px); box-shadow: none; }

        /* Slidedown navigation */
        .nav-overlay {
            display: none;
            position: absolute;
            top: 52px; left: 0; right: 0;
            background: var(--surface);
            border-bottom: 2px solid var(--border);
            z-index: 100;
            flex-direction: column;
            padding: 16px;
            gap: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        /* ── Workspace layout ─────────────────────────────────── */
        .workspace {
            flex: 1;
            display: flex;
            overflow: hidden;
            position: relative;
            z-index: 5;
        }

        /* ── Sidebar ──────────────────────────────────────────── */
        .sidebar {
            width: 260px;
            flex-shrink: 0;
            background: var(--surface);
            border-right: 2px solid var(--border);
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            z-index: 5;
        }
        .section-label {
            font-size: 10.5px;
            font-weight: 700;
            letter-spacing: .5px;
            text-transform: uppercase;
            color: var(--subtle);
            margin-bottom: 6px;
        }
        
        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .pill-list {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
        }
        .pill {
            padding: 4px 10px; font-size: 11px; font-weight: 600;
            color: var(--text); background: var(--surface-raised);
            border: 1px solid var(--border); border-radius: var(--radius-sm);
            cursor: pointer; white-space: nowrap;
            box-shadow: 1.5px 1.5px 0px var(--border);
        }
        .pill.active {
            border-color: var(--border);
            color: var(--text);
            background: var(--surface-inset);
            box-shadow: none;
            transform: translate(1.5px, 1.5px);
        }

        .stats-box {
            padding: 10px 14px;
            border: 1px solid var(--border);
            background: var(--surface-inset);
            border-radius: var(--radius-sm);
            font-size: 12.5px;
            color: var(--text);
            box-shadow: inset 1.5px 1.5px 0px rgba(0,0,0,0.05);
            font-weight: 600;
        }
        .stats-count {
            font-weight: 800;
        }

        /* Legend */
        .legend-row {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: var(--muted);
            margin-bottom: 4px;
        }
        .legend-dot {
            width: 11px; height: 11px;
            border-radius: 50%;
            border: 2px solid var(--border);
            box-shadow: 1px 1px 0px rgba(0,0,0,0.15);
        }

        /* ── Map Container ────────────────────────────────────── */
        .map-wrap {
            flex: 1;
            position: relative;
        }
        #map {
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Info Popup / Overlay Panel (Double border Neo-Skeuo) */
        .info-panel {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 320px;
            background: var(--surface);
            border: 3px double var(--border);
            border-radius: var(--radius-sm);
            box-shadow: var(--shadow-block);
            padding: 16px;
            display: none;
            z-index: 1000;
            flex-direction: column;
            gap: 12px;
        }
        .info-header {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        .info-avatar {
            width: 48px; height: 48px;
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            display: flex; align-items: center; justify-content: center;
            font-size: 20px; font-weight: 800;
            color: rgba(255,255,255,0.9);
            text-shadow: 1px 1px 0px var(--border);
            flex-shrink: 0;
        }
        .info-title {
            font-size: 15px;
            font-weight: 800;
            color: var(--text);
            text-transform: uppercase;
        }
        .info-meta-row {
            display: flex;
            font-size: 12.5px;
            gap: 6px;
        }
        .info-key {
            color: var(--subtle);
            font-weight: 700;
            min-width: 60px;
            text-transform: uppercase;
            font-size: 10.5px;
        }
        .info-val {
            color: var(--text);
            font-weight: 600;
        }
        .info-notes {
            font-size: 12px;
            color: var(--muted);
            border-top: 1px dashed var(--border-subtle);
            padding-top: 8px;
            line-height: 1.5;
            max-height: 100px;
            overflow-y: auto;
        }
        .info-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 6px 12px;
            background: var(--surface-raised);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 11.5px;
            font-weight: 700;
            text-decoration: none;
            text-align: center;
            text-transform: uppercase;
            box-shadow: 2px 2px 0px var(--border);
        }
        .info-btn:active { transform: translate(1.5px, 1.5px); box-shadow: none; }

        /* Custom Leaflet overrides for skeuo */
        .leaflet-bar {
            border: 2px solid var(--border) !important;
            box-shadow: 3px 3px 0px var(--border) !important;
            border-radius: var(--radius-sm) !important;
        }
        .leaflet-bar a {
            background-color: var(--surface-raised) !important;
            color: var(--text) !important;
            border-bottom: 1px solid var(--border) !important;
        }
        .leaflet-bar a:last-child { border-bottom: none !important; }

        /* ── Responsive / Mobile Drawer Adjustments ────────────── */
        @media (max-width: 768px) {
            .topbar-nav-links { display: none; }
            .menu-toggle, .filter-toggle { display: block; }
            
            .sidebar {
                position: absolute;
                left: 0; top: 0; bottom: 0; width: 260px;
                transform: translateX(-100%);
                transition: transform 0.3s ease;
                z-index: 100;
                box-shadow: 4px 0 0 var(--border);
            }
            .sidebar.open {
                transform: translateX(0);
            }

            .info-panel {
                width: calc(100% - 40px);
                left: 20px;
                right: 20px;
                bottom: 20px;
            }
            .nav-overlay.open {
                display: flex;
            }
        }
    </style>
</head>

    <script>
        const people = {};
        
        const PLACE_COORDS = {
            "Edén": [37.5, 42.5],
            "Jardín del Edén": [37.5, 42.5],
            "Jardín del edén": [37.5, 42.5],
            "Mesopotamia": [33.5, 44.5],

            "Tierra de Canaán": [31.5, 35.5],

            "Ur de los Caldeos": [30.96, 46.1],
            "Ur": [30.96, 46.1],
            "Harán": [36.86, 39.03],
            "Padan-aram": [36.86, 39.03],
            "Egipto": [27.0, 30.0],
            "Tierra de Gosén": [30.8, 31.7],
            "Gosén": [30.8, 31.7],
            "Belén": [31.70, 35.20],
            "Jerusalén": [31.78, 35.23],
            "Hebrón": [31.53, 35.10],
            "Siquem": [32.21, 35.29],
            "Ramá": [31.92, 35.18],
            "Siló": [32.05, 35.29],
            "Gibá de Benjamín": [31.85, 35.22],
            "Gibá": [31.85, 35.22],
            "Mambré": [31.53, 35.10],
            "Beerseba": [31.25, 34.79],
            "Gaza": [31.51, 34.47],
            "Jericó": [31.86, 35.44],
            "Dotán": [32.42, 35.20],
            "Peniel": [32.20, 35.60],
            "Mizpa": [31.87, 35.20],
            "Moab": [31.2, 35.7],
            "Amón": [31.95, 35.93],
            "Edom": [30.5, 35.5],
            "Idumea": [30.5, 35.5],
            "Desierto de Sinaí": [29.5, 33.8],
            "Sinaí": [29.5, 33.8],
            "Fuera del Edén": [36.0, 41.0],
            "Tierra de Nod": [36.0, 41.5],
            "Arabia": [25.0, 45.0],
            "Damasco": [33.51, 36.29],
            "Siria": [34.8, 38.9],
            "Nínive": [36.36, 43.15],
            "Asiria": [36.0, 43.5],
            "Babilonia": [32.54, 44.42],
            "Babel": [32.54, 44.42],
            "Persia": [32.0, 53.0]
        };

        function buildRelationshipMap() {
            if (typeof GENEALOGIA_DATA === 'undefined') return;
            function getOrCreate(name) {
                if (!name) return null;
                const n = name.trim(); if (!n) return null;
                if (!people[n]) people[n] = { name:n, gender:"M", father:"", mother:"", birthPlace:"", spouses:new Set(), children:[], notes:"", reference:"", meaning:"" };
                return people[n];
            }
            GENEALOGIA_DATA.forEach(row => {
                const childName = row["Hijos"], fatherName = row["Padre"], motherName = row["Madre"];
                const child = getOrCreate(childName), father = getOrCreate(fatherName), mother = getOrCreate(motherName);
                if (child) {
                    if (fatherName) child.father = fatherName;
                    if (motherName) child.mother = motherName;
                    child.gender = row["Género Hijos"] || "M";
                    const rawPlace = row["Lugar de nacimiento"] || "";
                    child.birthPlace = rawPlace.replace(/\s*\(padre\)\s*/i, "").trim();

                    const fullInfo = row["Información Adicional"] || row["Notas"] || "";
                    const childMatch = fullInfo.match(/Sobre (?:el hijo|la hija) \([^)]+\):\s*(.+?)(?:\s*\|\s*Sobre (?:el padre|la madre)|$)/i);
                    child.notes = childMatch ? childMatch[1].trim() : fullInfo;
                    child.reference = row["Referencia"] || "";
                    if (row["Imagen_URL"])       child.imageUrl     = row["Imagen_URL"].trim();
                    if (row["Referencias_URLs"]) child.refsUrls     = row["Referencias_URLs"].trim();
                    if (row["Enlace_Externo"])   child.externalLink = row["Enlace_Externo"].trim();
                }
                if (father && childName) {
                    father.children.push({ name:childName, gender:row["Género Hijos"]||"M", birthPlace:(row["Lugar de nacimiento"]||"").replace(/\s*\(padre\)\s*/i,"").trim() });
                    if (motherName) { father.spouses.add(motherName); mother.spouses.add(fatherName); }
                }
                if (mother && childName) mother.children.push({ name:childName, gender:row["Género Hijos"]||"M", birthPlace:row["Lugar de nacimiento"]||"" });
                if (fatherName && row["Significado del Nombre (Padre)"]) father.meaning = row["Significado del Nombre (Padre)"];
            });
        }

        function findCoords(place) {
            if (!place) return null;
            if (PLACE_COORDS[place]) return PLACE_COORDS[place];
            const pl = place.toLowerCase();
            for (const [k, v] of Object.entries(PLACE_COORDS)) {
                if (pl.includes(k.toLowerCase()) || k.toLowerCase().includes(pl)) return v;
            }
            return null;
        }

        function getLineagePath(name) {
            const path = [], visited = new Set();
            let cur = people[name];
            while (cur && !visited.has(cur.name)) {
                path.unshift(cur.name);
                visited.add(cur.name);
                if (cur.name.toLowerCase() === "adam") break;
                cur = people[cur.father];
            }
            return path;
        }

        function belongsToLineage(name, rootLineage) {
            if (rootLineage === "Todos") return true;
            return getLineagePath(name).includes(rootLineage);
        }

        function avatarGradient(name) {
            let h = 0;
            for (let i = 0; i < name.length; i++) h = name.charCodeAt(i) + ((h << 5) - h);
            const h1 = Math.abs(h % 360), h2 = (h1 + 55) % 360;
            return `linear-gradient(135deg, hsl(${h1},65%,48%) 0%, hsl(${h2},65%,38%) 100%)`;
        }

        let map, markersGroup, lightTile, darkTile;
        let selectedLineage = "Todos";
        let selectedGender = "Todos";

        function initMap() {
            map = L.map('map', { center: [32.3, 38], zoom: 5 });
            
            lightTile = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap contributors',
                maxZoom: 18
            });
            darkTile = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                attribution: '© CartoDB',
                maxZoom: 18
            });

            lightTile.addTo(map);

            markersGroup = L.markerClusterGroup({ showCoverageOnHover: false });
            map.addLayer(markersGroup);
        }

        function getMarkerIcon(gender) {
            const color = gender === "F" ? "var(--f-dot)" : "var(--m-dot)";
            return L.divIcon({
                className: '',
                html: `<div style="width:14px; height:14px; background:${color}; border:2px solid var(--border); border-radius:50%; box-shadow:1.5px 1.5px 0px var(--border);"></div>`,
                iconSize: [14, 14],
                iconAnchor: [7, 7]
            });
        }

        function populateMarkers() {
            markersGroup.clearLayers();
            let count = 0;

            Object.values(people).forEach(p => {
                if (!p.birthPlace) return;
                if (selectedGender === "M" && p.gender === "F") return;
                if (selectedGender === "F" && p.gender !== "F") return;
                if (selectedLineage !== "Todos" && !belongsToLineage(p.name, selectedLineage)) return;

                const coords = findCoords(p.birthPlace);
                if (!coords) return;

                const marker = L.marker(coords, { icon: getMarkerIcon(p.gender) });
                marker.on("click", () => showInfoPanel(p));
                markersGroup.addLayer(marker);
                count++;
            });

            document.getElementById("markerCount").textContent = count;
        }

        function showInfoPanel(p) {
            const panel = document.getElementById("infoPanel");
            const grad = avatarGradient(p.name);
            
            panel.innerHTML = `
                <button onclick="document.getElementById('infoPanel').style.display='none'" style="position:absolute; top:12px; right:12px; background:none; border:none; cursor:pointer; font-size:18px; color:var(--subtle);">×</button>
                <div class="info-header">
                    <div class="info-avatar" style="background:${grad}">${p.name.charAt(0)}</div>
                    <div>
                        <div class="info-title">${p.name}</div>
                        <div style="font-size:11.5px; color:var(--muted); font-style:italic;">Origen: ${p.birthPlace}</div>
                    </div>
                </div>
                <div style="display:flex; flex-direction:column; gap:6px; font-size:12.5px; margin-top:4px;">
                    ${p.father ? `<div class="info-meta-row"><span class="info-key">Padre</span><span class="info-val">${p.father}</span></div>` : ''}
                    ${p.mother ? `<div class="info-meta-row"><span class="info-key">Madre</span><span class="info-val">${p.mother}</span></div>` : ''}
                    <div class="info-meta-row"><span class="info-key">Hijos</span><span class="info-val">${p.children.length} registrados</span></div>
                </div>
                ${p.notes ? `<p class="info-notes">${p.notes.substring(0, 160)}${p.notes.length > 160 ? '...' : ''}</p>` : ''}
                <a href="visor_genealogia.html?name=${encodeURIComponent(p.name)}" class="info-btn" target="_blank">Ver ficha completa →</a>
            `;
            panel.style.display = "flex";
        }

        function setupTheme() {
            const toggle = document.getElementById("themeToggle");
            const sun = document.getElementById("sunIcon"), moon = document.getElementById("moonIcon");
            const apply = theme => {
                document.documentElement.setAttribute("data-theme", theme);
                sun.style.display = theme === "dark" ? "block" : "none";
                moon.style.display = theme === "dark" ? "none" : "block";
                
                if (map) {
                    if (theme === "dark") {
                        if (map.hasLayer(lightTile)) map.removeLayer(lightTile);
                        darkTile.addTo(map);
                    } else {
                        if (map.hasLayer(darkTile)) map.removeLayer(darkTile);
                        lightTile.addTo(map);
                    }
                }
            };
            apply(localStorage.getItem("theme") || "light");
            toggle.addEventListener("click", () => {
                const next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
                localStorage.setItem("theme", next); apply(next);
            });
        }

        function setupResponsive() {
            const menuToggle = document.getElementById("menuToggle");
            const filterToggle = document.getElementById("filterToggle");
            const navOverlay = document.getElementById("navOverlay");
            const sidebar = document.getElementById("sidebar");
            const backdrop = document.getElementById("mapBackdrop");

            menuToggle.addEventListener("click", e => {
                navOverlay.classList.toggle("open");
                sidebar.classList.remove("open");
                backdrop.style.display = "none";
                e.stopPropagation();
            });

            filterToggle.addEventListener("click", e => {
                const isOpen = sidebar.classList.contains("open");
                if (isOpen) {
                    sidebar.classList.remove("open");
                    backdrop.style.display = "none";
                } else {
                    sidebar.classList.add("open");
                    navOverlay.classList.remove("open");
                    backdrop.style.display = "block";
                }
                e.stopPropagation();
            });

            backdrop.addEventListener("click", () => {
                sidebar.classList.remove("open");
                backdrop.style.display = "none";
            });

            document.addEventListener("click", () => {
                navOverlay.classList.remove("open");
            });
        }

        window.addEventListener("DOMContentLoaded", () => {
            buildRelationshipMap();
            initMap();
            populateMarkers();
            setupTheme();
            setupResponsive();

            const overlay = document.getElementById("loadingOverlay");
            overlay.style.opacity = "0";
            setTimeout(() => overlay.style.display = "none", 300);

            // Filter actions
            document.querySelectorAll("#lineageFilter .pill").forEach(btn => {
                btn.addEventListener("click", () => {
                    document.querySelectorAll("#lineageFilter .pill").forEach(b => b.classList.remove("active"));
                    btn.classList.add("active");
                    selectedLineage = btn.dataset.val;
                    populateMarkers();
                    document.getElementById("infoPanel").style.display = "none";

                    if (window.innerWidth <= 768) {
                        document.getElementById("sidebar").classList.remove("open");
                        document.getElementById("mapBackdrop").style.display = "none";
                    }
                });
            });

            document.querySelectorAll("#genderFilter .pill").forEach(btn => {
                btn.addEventListener("click", () => {
                    document.querySelectorAll("#genderFilter .pill").forEach(b => b.classList.remove("active"));
                    btn.classList.add("active");
                    selectedGender = btn.dataset.val;
                    populateMarkers();
                    document.getElementById("infoPanel").style.display = "none";

                    if (window.innerWidth <= 768) {
                        document.getElementById("sidebar").classList.remove("open");
                        document.getElementById("mapBackdrop").style.display = "none";
                    }
                });
            });
        });
    </script>
</body>
</html>
