<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Genealogía Bíblica · Árbol Interactivo</title>
    <meta name="description" content="Explorador visual interactivo del árbol genealógico bíblico con zoom, arrastre y fichas in-place.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        /* ── Neo-Skeuo Design tokens ──────────────────────────── */
        :root {
            --bg:             #faf6f0; /* Tono gris amarronado lavado extra suave */
            --surface:        #f4f0e8; /* Base de ficha */
            --surface-raised: #f7f6f2; /* Elemento elevado */
            --surface-inset:  #dedad0; /* Superficie hundida */
            --border:         #1a1917; /* Negro tinta lavada */
            --border-subtle:  #7a7870;
            --text:           #1a1917;
            --muted:          #5a5850;
            --subtle:         #8a8880;
            --accent:         #1a1917;
            --accent-bg:      #dedad0;
            --m-node:         #e4ecfa;
            --m-border:       #1a1917;
            --m-dot:          #3b82f6;
            --f-node:         #fae3ee;
            --f-border:       #1a1917;
            --f-dot:          #e879a0;
            --line:           #1a1917;
            --radius-sm:      0px;
            --radius-md:      4px;
            --shadow-block:   3px 3px 0px var(--border);
        }
        [data-theme="dark"] {
            --bg:             #403d39; /* Gris pizarra oscuro lavado */
            --surface:        #32302d;
            --surface-raised: #47423b;
            --surface-inset:  #242321;
            --border:         #faf6f0; /* Tinta blanca lavada */
            --border-subtle:  #8a8880;
            --text:           #faf6f0;
            --muted:          #b0ada6;
            --subtle:         #6a6860;
            --accent:         #faf6f0;
            --accent-bg:      #242321;
            --m-node:         #2d3542;
            --m-border:       #faf6f0;
            --m-dot:          #60a5fa;
            --f-node:         #422e37;
            --f-border:       #faf6f0;
            --f-dot:          #f472b6;
            --line:           #faf6f0;
            --shadow-block:   3px 3px 0px var(--border);
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            font-size: 13.5px;
            background: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* Technical Dotted Grid */
        .dotted-grid {
            position: absolute;
            inset: 0;
            background-image: radial-gradient(var(--border-subtle) 1px, transparent 1px);
            background-size: 20px 20px;
            opacity: 0.08;
            pointer-events: none;
            z-index: 1;
        }

        /* Hatching background texture for nodes shadow */
        .hatching-pattern {
            background-image: repeating-linear-gradient(45deg, var(--border) 0, var(--border) 1px, transparent 0, transparent 5px);
        }

        /* Loading spinner */
        #loadingOverlay {
            position: fixed; inset: 0; background: var(--bg);
            display: flex; align-items: center; justify-content: center;
            z-index: 9999; flex-direction: column; gap: 16px;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }
        .spinner {
            width: 36px; height: 36px;
            border: 2px solid var(--border); border-top-color: var(--border-subtle);
            animation: spin .8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── Top bar ──────────────────────────────────────────── */
        .topbar {
            height: 52px;
            min-height: 52px;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 20px;
            background: var(--surface);
            border-bottom: 2px solid var(--border);
            flex-shrink: 0;
            z-index: 50;
        }
        .topbar-brand {
            font-size: 13px; font-weight: 700; color: var(--text);
            display: flex; align-items: center; gap: 8px;
            text-transform: uppercase;
        }
        .topbar-brand-dot { width: 8px; height: 8px; background: var(--text); border: 1px solid var(--bg); border-radius: 50%; }
        .topbar-sep { flex: 1; }
        .topbar-btn {
            display: flex; align-items: center; gap: 5px;
            padding: 5px 11px; font-size: 12px; font-weight: 600;
            color: var(--text); background: var(--surface-raised);
            border: 1px solid var(--border); border-radius: var(--radius-sm);
            cursor: pointer; text-decoration: none; font-family: inherit;
            box-shadow: 2px 2px 0px var(--border);
            transition: transform 0.1s, box-shadow 0.1s;
        }
        .topbar-btn:active, .topbar-btn.active {
            transform: translate(2px, 2px);
            box-shadow: none;
        }
        .topbar-btn svg { width: 13px; height: 13px; fill: currentColor; }

        .control-group {
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--surface-inset);
            padding: 4px 10px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 12px;
            font-weight: 600;
        }
        .control-group label {
            text-transform: uppercase;
            font-size: 10.5px;
            color: var(--muted);
        }

        .root-select {
            font-family: inherit; font-size: 12px; font-weight: 600;
            padding: 2px 6px; color: var(--text);
            background: var(--surface-raised); border: 1px solid var(--border);
            border-radius: var(--radius-sm); outline: none; cursor: pointer;
        }

        /* Custom Skeuo Slider */
        .range-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 70px;
            height: 4px;
            background: var(--border);
            outline: none;
        }
        .range-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            background: var(--surface-raised);
            border: 2.5px solid var(--border);
            cursor: pointer;
            box-shadow: 1px 1px 0px var(--border);
        }

        .hint {
            font-size: 11px; color: var(--subtle);
            display: flex; align-items: center; gap: 5px;
            text-transform: uppercase;
            font-weight: 600;
        }
        .hint svg { width: 12px; height: 12px; fill: currentColor; }

        /* ── Canvas viewport ──────────────────────────────────── */
        .viewport {
            flex: 1; position: relative;
            cursor: grab; overflow: hidden;
            z-index: 5;
        }
        .viewport:active { cursor: grabbing; }
        .canvas {
            position: absolute;
            transform-origin: 0 0;
            padding: 80px 120px 120px;
            display: inline-block;
            will-change: transform;
            transform-style: preserve-3d;
            backface-visibility: hidden;
        }

        /* ── CSS Hierarchy Tree ───────────────────────────────── */
        .tree { display: inline-block; }
        .tree ul {
            padding-top: 36px;
            position: relative;
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        .tree li {
            display: flex; flex-direction: column; align-items: center;
            position: relative; padding: 36px 0 0 0; list-style: none;
        }

        /* Connectors */
        .tree li::before, .tree li::after {
            content: ''; position: absolute; top: 0; right: 50%;
            border-top: 2px solid var(--line); width: 50%; height: 36px;
        }
        .tree li::after { right: auto; left: 50%; border-left: 2px solid var(--line); }
        .tree li:only-child::after, .tree li:only-child::before { display: none; }
        .tree li:only-child { padding-top: 0; }
        .tree li:first-child::before, .tree li:last-child::after { border: 0 none; }
        .tree li:last-child::before { border-right: 2px solid var(--line); }
        .tree ul::before {
            content: ''; position: absolute; top: 0; left: 50%;
            border-left: 2px solid var(--line); width: 0; height: 36px;
        }

        /* ── Node card ────────────────────────────────────────── */
        .tree-node {
            background: var(--surface);
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 8px 12px;
            display: flex; flex-direction: column; gap: 0;
            min-width: 140px; max-width: 200px;
            position: relative; z-index: 2;
            cursor: pointer;
            box-shadow: var(--shadow-block);
            -webkit-font-smoothing: subpixel-antialiased;
            text-rendering: geometricPrecision;
            transition: transform 0.1s, box-shadow 0.1s;
        }
        .tree-node:hover { transform: translate(-1px, -1px); box-shadow: 4px 4px 0px var(--border); }
        
        .tree-node.m { background: var(--m-node); border-color: var(--m-border); }
        .tree-node.f { background: var(--f-node); border-color: var(--f-border); }
        
        /* Node selected / expanded */
        .tree-node.expanded, .tree-node.highlighted {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px var(--border);
            min-width: 240px;
            max-width: 280px;
        }

        .node-header { display: flex; align-items: center; gap: 7px; cursor: pointer; }
        .node-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; border: 1.5px solid var(--border); }
        .node-label { font-size: 12.5px; font-weight: 700; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* Collapse toggle */
        .toggle-btn {
            position: absolute; bottom: -10px; left: 50%;
            transform: translateX(-50%);
            width: 20px; height: 20px;
            background: var(--surface-raised); border: 1.5px solid var(--border);
            font-size: 12px; font-weight: 800; color: var(--text);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; z-index: 5; line-height: 1; font-family: inherit;
            box-shadow: 1px 1px 0px var(--border);
        }
        .toggle-btn:active { transform: translateX(-50%) translate(1px, 1px); box-shadow: none; }

        /* In-place detail panel */
        .node-detail {
            display: none;
            flex-direction: column;
            gap: 8px;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px dashed var(--border-subtle);
            font-size: 11.5px;
        }
        .nd-row { display: flex; gap: 6px; line-height: 1.4; }
        .nd-key { color: var(--subtle); font-weight: 700; text-transform: uppercase; min-width: 68px; flex-shrink: 0; }
        .nd-val { color: var(--text); font-weight: 600; }
        .nd-meaning { font-style: italic; color: var(--muted); border-left: 2px solid var(--border); padding-left: 6px; line-height: 1.5; }
        .nd-notes { color: var(--muted); line-height: 1.5; max-height: 80px; overflow-y: auto; }

        .nd-refs { display: flex; flex-wrap: wrap; gap: 4px; }
        .nd-ref-chip {
            display: inline-flex; align-items: center; gap: 3px;
            padding: 3px 8px; font-size: 10.5px; font-weight: 600;
            border: 1px solid var(--border); border-radius: var(--radius-sm);
            color: var(--text); text-decoration: none; background: var(--surface-raised);
            box-shadow: 1px 1px 0px var(--border);
        }
        .nd-ref-chip.link:hover { background: var(--surface-inset); }
        .nd-ref-chip svg { width: 9px; height: 9px; fill: currentColor; }

        .nd-open-btn {
            display: flex; align-items: center; justify-content: center; gap: 5px;
            padding: 5px 10px; font-size: 11px; font-weight: 700;
            background: var(--surface-raised); color: var(--text);
            border: 1px solid var(--border); border-radius: var(--radius-sm);
            text-decoration: none; cursor: pointer;
            box-shadow: 1.5px 1.5px 0px var(--border);
            text-transform: uppercase;
        }
        .nd-open-btn:active { transform: translate(1px, 1px); box-shadow: none; }
        .nd-open-btn svg { width: 11px; height: 11px; fill: currentColor; }

        /* ── Hover Tooltip ── */
        .tooltip-card {
            position: absolute;
            background: var(--surface);
            border: 2px solid var(--border);
            padding: 8px 12px;
            z-index: 1000;
            display: none;
            pointer-events: none;
            box-shadow: var(--shadow-block);
            font-size: 11.5px;
        }

        /* ── Minimap ── */
        .minimap-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 160px;
            height: 100px;
            background: var(--surface);
            border: 3px double var(--border);
            border-radius: var(--radius-sm);
            z-index: 100;
            box-shadow: var(--shadow-block);
            overflow: hidden;
            opacity: 0.85;
        }
        .minimap-svg {
            width: 100%;
            height: 100%;
            display: block;
        }
        .minimap-viewport {
            fill: rgba(0,0,0,0.04);
            stroke: var(--border);
            stroke-width: 1px;
            stroke-dasharray: 2 2;
        }
        [data-theme="dark"] .minimap-viewport {
            fill: rgba(255,255,255,0.04);
        }
    </style>
</head>
<body>

    <!-- Dotted Grid -->
    <div class="dotted-grid"></div>

    <!-- Spinner -->
    <div id="loadingOverlay">
        <div class="spinner"></div>
        <span style="font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;">[Procesando esquema jerárquico]</span>
    </div>

    <!-- Top bar -->
    <header class="topbar">
        <div class="topbar-brand">
            <div class="topbar-brand-dot"></div>
            Árbol Jerárquico
        </div>
        
        <div class="control-group">
            <label>Linaje Raíz</label>
            <select class="root-select" id="rootSelect">
                <option value="Adam">Adán — Patriarcas</option>
                <option value="Noé">Noé — Diluvio y Naciones</option>
                <option value="Abraham">Abraham — Linaje de la fe</option>

                <option value="David">David — Línea de Judá</option>
                <option value="Saúl">Saúl — Línea de Benjamín</option>
            </select>
        </div>

        <div class="control-group">
            <label>Profundidad</label>
            <input type="range" class="range-slider" id="depthSlider" min="1" max="8" value="5">

        </div>

        <button class="topbar-btn" id="btnAntepasados">Antepasados</button>
        <button class="topbar-btn" id="btnExport">Exportar PNG</button>

        <div class="topbar-sep"></div>

        <a href="index.html" class="topbar-btn">Inicio</a>
        <a href="visor_genealogia.html" class="topbar-btn">Fichas</a>
        <a href="grafo_relaciones.html" class="topbar-btn">Grafo</a>
        <a href="mapa_geografico.html" class="topbar-btn">Mapa</a>

        <button class="topbar-btn" id="themeToggle">
            <svg id="sunIcon" style="display:none" viewBox="0 0 24 24"><path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zm0 8c-1.65 0-3-1.35-3-3s1.35-3 3-3 3 1.35 3 3-1.35 3-3 3zm0-11c-.55 0-1-.45-1-1V2c0-.55.45-1 1-1s1 .45 1 1v1c0 .55-.45 1-1 1zm0 16c-.55 0-1 .45-1 1v1c0 .55.45 1 1 1s1-.45 1-1v-1c0-.55-.45-1-1-1zm8-8c0-.55-.45-1-1-1h-1c-.55 0-1 .45-1 1s.45 1 1 1h1c.55 0 1-.45 1-1zM6 12c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1s.45 1 1 1h1c.55 0 1-.45 1-1zm11.66-5.66l-.71-.71c-.39-.39-1.02-.39-1.41 0s-.39 1.02 0 1.41l.71.71c.39.39 1.02.39 1.41 0s.39-1.02 0-1.41zm-11.31 11.3l-.71.71c-.39.39-.39 1.02 0 1.41s1.02.39 1.41 0l.71-.71c.39-.39.39-1.02 0-1.41s-1.02-.39-1.41 0zm11.31.01l-.71.71c-.39-.39-1.02-.39-1.41 0l.71.71c.39.39 1.02.39 1.41 0s.39-1.02 0-1.41zM6.35 6.34l-.71-.71c-.39-.39-1.02-.39-1.41 0s-.39 1.02 0 1.41l.71.71c.39.39 1.02.39 1.41 0s.39-1.02 0-1.41z"/></svg>
            <svg id="moonIcon" viewBox="0 0 24 24"><path d="M12.3 22h-.1c-5.5 0-10-4.5-10-10 0-4.8 3.5-8.9 8.3-9.7.6-.1 1.1.4 1 1-.4 2.4.4 4.9 2.1 6.6 1.7 1.7 4.2 2.5 6.6 2.1.6-.1 1.1.4 1 1-.8 4.8-4.9 8.3-9.7 8.3z"/></svg>
            Tema
        </button>

    <!-- Viewport -->
    <div class="viewport" id="viewport">
        <div class="canvas" id="canvas">
            <div class="tree" id="treeRoot"></div>
        </div>
    </div>

    <!-- Minimap -->
    <div class="minimap-container">
        <svg class="minimap-svg" id="minimapSvg">
            <g id="minimapNodes"></g>
            <rect class="minimap-viewport" id="minimapViewportRect" x="0" y="0" width="0" height="0" />
        </svg>
    </div>

    <!-- Tooltip Floating Card -->
    <div class="tooltip-card" id="hoverTooltip"></div>

    <script src="genealogia_data.js"></script>
    <script>
        const people = {};
        let ancestorMode = false;
        let selectedRootName = "Adam";
        let currentMaxDepth = 5;

        const localPatriarchDetails = {
            "Adam": { lugar:"Jardín del Edén", significado:"Del hebreo «אָדָם» (adam), «hombre» o «tierra».", cruzada:"1 Crónicas 1 [Cruces: Adam: Génesis 1:26-27, 2:7, 5:1-5; Lucas 3:38; Romanos 5:12-21]", adicional:"Primer ser humano. Colocado en el Edén y expulsado tras desobedecer." },
            "Eva":  { lugar:"Jardín del Edén", significado:"Del hebreo «חַוָּה» (Chavah), «vida».", cruzada:"Génesis 2:21-25, 3:1-20; 2 Corintios 11:3", adicional:"Primera mujer, creada de Adán." },
            "Set":  { lugar:"Fuera del Edén", significado:"Del hebreo «שֵׁת» (Sheth), «sustituto».", cruzada:"1 Crónicas 1 [Cruces: Set: Génesis 4:25-26, 5:3-8]", adicional:"Tercer hijo de Adán y Eva. De su línea desciende Noé." },
            "Noé":  { lugar:"Mesopotamia", significado:"Del hebreo «נֹחַ» (Noach), «descanso».", cruzada:"1 Crónicas 1 [Cruces: Noé: Génesis 5:28-32, caps. 6-9]", adicional:"Construyó el arca y salvó a su familia del Diluvio." },
            "Abraham": { lugar:"Ur de los Caldeos", significado:"Del hebreo «אַבְrָהָם» (Avraham), «padre de multitudes».", cruzada:"1 Crónicas 1 [Cruces: Abraham: Génesis 11:26-32, caps. 12-25]", adicional:"Patriarca de la fe." },
            "Israel": { lugar:"Padan-aram", significado:"Del hebreo «יִשְׂרָאֵל» (Yisrael), «el que lucha con Dios».", cruzada:"1 Crónicas 2 [Cruces: Israel: Génesis 25-35, 46-50]", adicional:"Hijo de Isaac. Padre de las 12 tribus." },
            "David": { lugar:"Belén", significado:"Del hebreo «דָּוִד» (David), «amado».", cruzada:"1 Crónicas 3 [Cruces: David: 1 Samuel 16-31; 2 Samuel]", adicional:"Segundo rey de Israel. Recibió la promesa mesiánica." },
            "Salomón": { lugar:"Jerusalén", significado:"Del hebreo «שְׁלֹmֹה» (Shlomoh), «pacífico».", cruzada:"1 Crónicas 3 [Cruces: Salomón: 1 Reyes 1-11]", adicional:"Hijo de David. Edificó el Primer Templo de Jerusalén." }
        };

        function buildRelationshipMap() {
            if (typeof GENEALOGIA_DATA === 'undefined') return;
            function getOrCreate(name) {
                if (!name) return null;
                const n = name.trim(); if (!n) return null;
                if (!people[n]) people[n] = { name:n, gender:"M", father:"", mother:"", birthPlace:"", spouses:new Set(), children:[], notes:"", reference:"", meaning:"" };
                return people[n];
            }
            GENEALOGIA_DATA.forEach(row => {
                const cn = row["Hijos"], fn = row["Padre"], mn = row["Madre"];
                const child = getOrCreate(cn), father = getOrCreate(fn), mother = getOrCreate(mn);
                if (child) {
                    if (fn) child.father = fn;
                    if (mn) child.mother = mn;
                    child.gender = row["Género Hijos"]||"M";
                    child.birthPlace = (row["Lugar de nacimiento"]||"").replace(/\s*\(padre\)\s*/i,"").trim();
                    const fi = row["Información Adicional"]||row["Notas"]||"";
                    const cm = fi.match(/Sobre (?:el hijo|la hija) \([^)]+\):\s*(.+?)(?:\s*\|\s*Sobre (?:el padre|la madre)|$)/i);
                    child.notes = cm ? cm[1].trim() : fi;
                    child.reference = row["Referencia"]||"";
                    if (row["Imagen_URL"])       child.imageUrl     = (row["Imagen_URL"]||"").trim();
                    if (row["Referencias_URLs"]) child.refsUrls     = (row["Referencias_URLs"]||"").trim();
                    if (row["Enlace_Externo"])   child.externalLink = (row["Enlace_Externo"]||"").trim();
                }
                const cleanBP = (row["Lugar de nacimiento"]||"").replace(/\s*\(padre\)\s*/i,"").trim();
                if (father && cn) { father.children.push({name:cn,gender:row["Género Hijos"]||"M",birthPlace:cleanBP}); if (mn){father.spouses.add(mn);mother.spouses.add(fn);} }
                if (mother && cn) mother.children.push({name:cn,gender:row["Género Hijos"]||"M",birthPlace:cleanBP});
                if (fn && row["Significado del Nombre (Padre)"]) father.meaning = row["Significado del Nombre (Padre)"];
            });
            Object.keys(localPatriarchDetails).forEach(name => {
                const loc = localPatriarchDetails[name], p = getOrCreate(name); if (!p) return;
                if (loc.lugar) p.birthPlace = loc.lugar; if (loc.significado) p.meaning = loc.significado;
                if (loc.adicional) p.notes = loc.adicional; if (loc.cruzada) p.reference = loc.cruzada;
            });
        }

        function dotColor(gender) { return gender.toLowerCase() === "f" ? "var(--f-dot)" : "var(--m-dot)"; }

        function getBibleUrl(ref) {
            if (!ref) return null;
            const m = ref.match(/([1-2]\s+)?([A-ZÁÉÍÓÚ][a-zñáéíóúü]+(?:\s+de\s+[a-zñáéíóúü]+)?)\s+(\d+)/i);
            if (!m) return null;
            const prefix = m[1] ? m[1].trim()+"-" : "";
            const book = m[2].trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/\s+/g,"-");
            if (prefix+book === "mateo" && m[3] === "24") return "https://btx4-juan.sociedadbiblicaiberoamericana.net/24-segun-mateo/c/0/i/23237365/capitulo-24";
            return null;
        }

        // Descendant representation
        function buildTreeData(nodeName, maxDepth=5, depth=0, visited=new Set()) {
            if (visited.has(nodeName) || depth > maxDepth) return null;
            visited.add(nodeName);
            const p = people[nodeName];
            if (!p) return { name:nodeName, gender:"M", children:[] };
            let kids = p.children;
            if (nodeName.toLowerCase()==="adam" && kids.length===0)
                kids = [{name:"Caín",gender:"M"},{name:"Abel",gender:"M"},{name:"Set",gender:"M"}];
            return { name:p.name, gender:p.gender, children: kids.map(c=>buildTreeData(c.name,maxDepth,depth+1,visited)).filter(Boolean) };
        }

        // Ancestor Mode representation
        function buildAncestorData(nodeName, maxDepth=5, depth=0, visited=new Set()) {
            if (visited.has(nodeName) || depth > maxDepth) return null;
            visited.add(nodeName);
            const p = people[nodeName];
            if (!p) return { name:nodeName, gender:"M", children:[] };
            
            const ancestors = [];
            if (p.father) ancestors.push({ name: p.father, gender: "M" });
            if (p.mother) ancestors.push({ name: p.mother, gender: "F" });

            return { 
                name: p.name, 
                gender: p.gender, 
                children: ancestors.map(a => buildAncestorData(a.name, maxDepth, depth+1, visited)).filter(Boolean) 
            };
        }

        // Hover tooltip debouncing
        let hoverTimeout;
        const tooltip = document.getElementById("hoverTooltip");

        function showTooltip(e, nodeName) {
            clearTimeout(hoverTimeout);
            hoverTimeout = setTimeout(() => {
                const p = people[nodeName];
                if (!p) return;
                tooltip.innerHTML = `
                    <div style="font-weight:700;text-transform:uppercase;">${p.name}</div>
                    ${p.father ? `<div><span style="color:var(--subtle)">Padre:</span> ${p.father}</div>` : ""}
                    ${p.children.length > 0 ? `<div><span style="color:var(--subtle)">Hijos:</span> ${p.children.length}</div>` : ""}
                `;
                tooltip.style.left = `${e.pageX + 12}px`;
                tooltip.style.top = `${e.pageY + 12}px`;
                tooltip.style.display = "block";
            }, 400);
        }

        function hideTooltip() {
            clearTimeout(hoverTimeout);
            tooltip.style.display = "none";
        }

        // Center view on specific node
        function centerOnNode(nodeDiv) {
            const vp = document.getElementById("viewport").getBoundingClientRect();
            const canvas = document.getElementById("canvas");
            
            canvas.classList.add("animating");
            scale = 1.0;
            tx = (vp.width / 2) - (nodeDiv.offsetLeft + nodeDiv.offsetWidth / 2);
            ty = (vp.height / 2) - (nodeDiv.offsetTop + nodeDiv.offsetHeight / 2);
            applyTransform();
            
            setTimeout(() => canvas.classList.remove("animating"), 350);
        }

        function renderNode(node) {
            const li = document.createElement("li");
            const nodeDiv = document.createElement("div");
            const gClass = node.gender.toLowerCase() === "f" ? "f" : "m";
            nodeDiv.className = `tree-node ${gClass}`;
            nodeDiv.dataset.nodeName = node.name;

            nodeDiv.innerHTML = `
                <div class="node-header">
                    <span class="node-dot" style="background:${dotColor(node.gender)}"></span>
                    <span class="node-label">${node.name}</span>
                </div>
            `;

            // Hover events
            nodeDiv.addEventListener("mouseenter", e => showTooltip(e, node.name));
            nodeDiv.addEventListener("mousemove", e => {
                tooltip.style.left = `${e.pageX + 12}px`;
                tooltip.style.top = `${e.pageY + 12}px`;
            });
            nodeDiv.addEventListener("mouseleave", hideTooltip);

            // Click → expand in-place
            nodeDiv.onclick = e => {
                const isOpen = nodeDiv.classList.contains("expanded");
                document.querySelectorAll(".tree-node").forEach(n => {
                    n.classList.remove("expanded","highlighted");
                    const det = n.querySelector(".node-detail");
                    if (det) det.style.display = "none";
                });
                if (!isOpen) {
                    nodeDiv.classList.add("expanded","highlighted");
                    let det = nodeDiv.querySelector(".node-detail");
                    if (!det) {
                        det = document.createElement("div");
                        det.className = "node-detail";
                        nodeDiv.appendChild(det);
                    }
                    const p = people[node.name] || { gender:node.gender, birthPlace:"", father:"", mother:"", spouses:new Set(), children:[], notes:"", reference:"", meaning:"" };
                    const spousesList = p.spouses ? Array.from(p.spouses).join(", ") : (node.name.toLowerCase()==="adam"?"Eva":"");
                    const childCount  = p.children ? p.children.length : 0;

                    const urlList = (p.refsUrls||"").split("|").map(u=>u.trim()).filter(Boolean);
                    let refsHtml = "";
                    if (p.reference) {
                        const mainRef = p.reference.split("[")[0].trim();
                        const crucesMatch = p.reference.match(/\[Cruces:\s*(.*)\]/);
                        const allTexts = [mainRef];
                        if (crucesMatch && crucesMatch[1]) {
                            crucesMatch[1].split(";").forEach(c => {
                                const cl = c.replace(/^[A-Z\u00c1\u00c9\u00cd\u00d3\u00da][a-z\u00f1\u00e1\u00e9\u00ed\u00f3\u00fa\u00fc]+:\s*/i,"").trim();
                                if (cl) allTexts.push(cl);
                            });
                        }
                        refsHtml = allTexts.map((ref,i) => {
                            const url = urlList[i] || getBibleUrl(ref);
                            return url
                                ? `<a href="${url}" class="nd-ref-chip link" target="_blank" rel="noopener noreferrer"><svg viewBox="0 0 24 24" style="width:9px;height:9px;fill:currentColor;"><path d="M19 19H5V5h7V3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z"/></svg>${ref}</a>`
                                : `<span class="nd-ref-chip">${ref}</span>`;
                        }).join("");
                    }

                    const notesText = p.notes || (p.father ? `Mencionado en las genealogías bíblicas como hijo de ${p.father}.` : "");

                    det.innerHTML = `
                        ${p.birthPlace ? `<div class="nd-row"><span class="nd-key">Origen</span><span class="nd-val">${p.birthPlace}</span></div>` : ""}
                        ${p.father    ? `<div class="nd-row"><span class="nd-key">Padre</span><span class="nd-val">${p.father}</span></div>` : ""}
                        ${p.mother    ? `<div class="nd-row"><span class="nd-key">Madre</span><span class="nd-val">${p.mother}</span></div>` : ""}
                        ${spousesList ? `<div class="nd-row"><span class="nd-key">Cónyuge</span><span class="nd-val">${spousesList}</span></div>` : ""}
                        ${childCount  ? `<div class="nd-row"><span class="nd-key">Hijos</span><span class="nd-val">${childCount} registrado${childCount>1?"s":""}</span></div>` : ""}
                        ${p.meaning   ? `<div class="nd-meaning">${p.meaning}</div>` : ""}
                        ${notesText   ? `<div class="nd-notes">${notesText}</div>` : ""}
                        ${refsHtml    ? `<div class="nd-refs">${refsHtml}</div>` : ""}
                        
                        <div style="display:flex;gap:4px;margin-top:6px;">
                            <button class="nd-open-btn" style="flex:1;" onclick="centerOnNode(this.closest('.tree-node')); event.stopPropagation();">Centrar</button>
                            <a href="visor_genealogia.html?name=${encodeURIComponent(node.name)}" class="nd-open-btn" target="_blank" style="flex:1;">Ficha completa</a>
                        </div>
                    `;
                    det.style.display = "flex";
                }
                e.stopPropagation();
            };

            li.appendChild(nodeDiv);

            if (node.children && node.children.length > 0) {
                const toggle = document.createElement("button");
                toggle.className = "toggle-btn"; toggle.textContent = "−";
                toggle.onclick = e => {
                    const ul = li.querySelector("ul");
                    const collapsed = ul.style.display === "none";
                    ul.style.display = collapsed ? "flex" : "none";
                    toggle.textContent = collapsed ? "−" : "+";
                    e.stopPropagation();
                    setTimeout(updateMinimap, 100);
                };
                nodeDiv.appendChild(toggle);

                const ul = document.createElement("ul");
                node.children.forEach(c => ul.appendChild(renderNode(c)));
                li.appendChild(ul);
            }
            return li;
        }

        function loadTree(rootName) {
            const rootEl = document.getElementById("treeRoot");
            rootEl.innerHTML = "";
            const data = ancestorMode 
                ? buildAncestorData(rootName, currentMaxDepth)
                : buildTreeData(rootName, currentMaxDepth);
            if (data) rootEl.appendChild(renderNode(data));
            resetView();
            setTimeout(updateMinimap, 200);
        }

        // ── Pan & zoom ─────────────────────────────────────────────
        let scale = 0.82, tx = 0, ty = 0, dragging = false, sx = 0, sy = 0;

        function applyTransform() {
            document.getElementById("canvas").style.transform = `translate3d(${tx}px,${ty}px,0) scale(${scale})`;
            updateMinimapViewport();
        }

        function resetView() {
            const vp = document.getElementById("viewport");
            const cv = document.getElementById("canvas");
            scale = 0.82;
            tx = (vp.clientWidth / 2) - (cv.scrollWidth * scale / 2) + 160;
            ty = 60;
            applyTransform();
        }

        function setupPanZoom() {
            const vp = document.getElementById("viewport");
            vp.addEventListener("mousedown", e => {
                if (e.target.closest(".tree-node") || e.target.closest(".toggle-btn")) return;
                dragging = true; sx = e.clientX - tx; sy = e.clientY - ty;
            });
            window.addEventListener("mousemove", e => { if (!dragging) return; tx = e.clientX - sx; ty = e.clientY - sy; applyTransform(); });
            window.addEventListener("mouseup", () => dragging = false);
            vp.addEventListener("wheel", e => {
                e.preventDefault();
                const f = 0.06, old = scale;
                scale = e.deltaY < 0 ? Math.min(3, scale+f) : Math.max(0.12, scale-f);
                const r = vp.getBoundingClientRect();
                const mx = e.clientX - r.left, my = e.clientY - r.top;
                tx = mx - (mx - tx) * (scale / old);
                ty = my - (my - ty) * (scale / old);
                applyTransform();
            }, { passive: false });

            // Touch events (Pinch-to-zoom & pan)
            let touchStartDist = 0;
            let touchStartScale = 1;
            vp.addEventListener("touchstart", e => {
                if (e.touches.length === 1) {
                    dragging = true; sx = e.touches[0].clientX - tx; sy = e.touches[0].clientY - ty;
                } else if (e.touches.length === 2) {
                    dragging = false;
                    touchStartDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
                    touchStartScale = scale;
                }
            });
            vp.addEventListener("touchmove", e => {
                if (dragging && e.touches.length === 1) {
                    tx = e.touches[0].clientX - sx; ty = e.touches[0].clientY - sy;
                    applyTransform();
                } else if (e.touches.length === 2) {
                    const dist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
                    const factor = dist / touchStartDist;
                    scale = Math.min(3, Math.max(0.12, touchStartScale * factor));
                    applyTransform();
                }
            });
            vp.addEventListener("touchend", () => dragging = false);
        }

        // ── Minimap SVG Rendering ─────────────────────────────────
        function updateMinimap() {
            const nodesContainer = document.getElementById("minimapNodes");
            nodesContainer.innerHTML = "";
            
            const nodes = document.querySelectorAll(".tree-node");
            if (nodes.length === 0) return;

            let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
            const nodesData = [];

            nodes.forEach(n => {
                const x = n.offsetLeft;
                const y = n.offsetTop;
                const gender = n.classList.contains("f") ? "F" : "M";
                nodesData.push({ x, y, gender });
                if (x < minX) minX = x; if (x > maxX) maxX = x;
                if (y < minY) minY = y; if (y > maxY) maxY = y;
            });

            // Map spacing
            const padding = 50;
            const boundsW = (maxX - minX) || 1;
            const boundsH = (maxY - minY) || 1;
            const scaleX = (160 - padding) / boundsW;
            const scaleY = (100 - padding) / boundsH;
            const mapScale = Math.min(scaleX, scaleY);

            nodesData.forEach(n => {
                const cx = (n.x - minX) * mapScale + (padding / 2);
                const cy = (n.y - minY) * mapScale + (padding / 2);
                const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                circle.setAttribute("cx", cx);
                circle.setAttribute("cy", cy);
                circle.setAttribute("r", "2.5");
                circle.setAttribute("fill", n.gender === "F" ? "var(--f-dot)" : "var(--m-dot)");
                circle.setAttribute("stroke", "var(--border)");
                circle.setAttribute("stroke-width", "0.5");
                nodesContainer.appendChild(circle);
            });

            window.minimapScale = mapScale;
            window.minimapMinX = minX;
            window.minimapMinY = minY;
            updateMinimapViewport();
        }

        function updateMinimapViewport() {
            const rect = document.getElementById("minimapViewportRect");
            const vp = document.getElementById("viewport");
            if (!vp || !window.minimapScale) return;

            const mapScale = window.minimapScale;
            const minX = window.minimapMinX;
            const minY = window.minimapMinY;

            const width = vp.clientWidth / scale * mapScale;
            const height = vp.clientHeight / scale * mapScale;
            const x = (-tx / scale - minX) * mapScale + 10;
            const y = (-ty / scale - minY) * mapScale + 10;

            rect.setAttribute("x", x);
            rect.setAttribute("y", y);
            rect.setAttribute("width", Math.max(10, width));
            rect.setAttribute("height", Math.max(10, height));
        }

        function selectNodeInTree(name) {
            const nd = document.querySelector(`.tree-node[data-node-name="${name}"]`);
            if (!nd) return false;
            if (!nd.classList.contains("expanded")) nd.click();
            centerOnNode(nd);
            return true;
        }

        function setupTheme() {
            const toggle = document.getElementById("themeToggle");
            const sun = document.getElementById("sunIcon"), moon = document.getElementById("moonIcon");
            const apply = theme => {
                document.documentElement.setAttribute("data-theme", theme);
                sun.style.display = theme === "dark" ? "block" : "none";
                moon.style.display = theme === "dark" ? "none" : "block";
            };
            apply(localStorage.getItem("theme") || "light");
            toggle.addEventListener("click", () => {
                const next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
                localStorage.setItem("theme", next); apply(next);
            });
        }

        function setupControls() {
            document.getElementById("rootSelect").addEventListener("change", e => {
                selectedRootName = e.target.value;
                loadTree(selectedRootName);
            });

            const slider = document.getElementById("depthSlider");
            const valDisplay = document.getElementById("depthVal");
            slider.addEventListener("input", e => {
                currentMaxDepth = parseInt(e.target.value);
                valDisplay.textContent = currentMaxDepth;
                loadTree(selectedRootName);
            });

            // Antepasados button toggle
            const antepasadosBtn = document.getElementById("btnAntepasados");
            antepasadosBtn.addEventListener("click", () => {
                ancestorMode = !ancestorMode;
                antepasadosBtn.classList.toggle("active", ancestorMode);
                loadTree(selectedRootName);
            });

            // Export PNG
            document.getElementById("btnExport").addEventListener("click", () => {
                const canvasEl = document.getElementById("canvas");
                html2canvas(canvasEl, {
                    backgroundColor: getComputedStyle(document.documentElement).getPropertyValue("--bg"),
                    logging: false,
                    useCORS: true
                }).then(canvas => {
                    const link = document.createElement("a");
                    link.download = `arbol_${selectedRootName}.png`;
                    link.href = canvas.toDataURL();
                    link.click();
                });
            });
        }

        window.addEventListener("DOMContentLoaded", () => {
            buildRelationshipMap();
            setupPanZoom();
            setupControls();
            setupTheme();
            loadTree("Adam");

            const params = new URLSearchParams(window.location.search);
            const initRoot = params.get("root"), highlight = params.get("highlight");
            if (initRoot && people[initRoot]) {
                document.getElementById("rootSelect").value = initRoot;
                selectedRootName = initRoot;
                loadTree(initRoot);
            }
            if (highlight) setTimeout(() => selectNodeInTree(highlight), 350);

            // Hide overlay spinner
            const overlay = document.getElementById("loadingOverlay");
            overlay.style.opacity = "0";
            setTimeout(() => overlay.style.display = "none", 300);
        });
    </script>
</body>
