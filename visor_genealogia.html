<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Genealogía Bíblica · Visor de Fichas</title>
    <meta name="description" content="Portal interactivo para explorar la genealogía bíblica de 1 Crónicas con fichas detalladas, referencias y linajes.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* ── Design tokens ────────────────────────────────────── */
        :root {
            --bg:        #f5f4f2;
            --surface:   #ffffff;
            --border:    #e4e2dc;
            --text:      #1a1916;
            --muted:     #7a7870;
            --subtle:    #b0ada6;
            --accent:    #1a56db;
            --accent-bg: #eef3ff;
            --m-dot:     #3b82f6;
            --f-dot:     #e879a0;
            --radius-sm: 8px;
            --radius-md: 14px;
            --radius-lg: 20px;
        }
        [data-theme="dark"] {
            --bg:        #111110;
            --surface:   #1c1b19;
            --border:    #2e2c28;
            --text:      #f0ede8;
            --muted:     #888580;
            --subtle:    #5a5753;
            --accent:    #5b8def;
            --accent-bg: #1a2340;
            --m-dot:     #60a5fa;
            --f-dot:     #f472b6;
        }

        /* ── Reset ────────────────────────────────────────────── */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { height: 100%; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            font-size: 14px;
            line-height: 1.5;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ── Top bar ──────────────────────────────────────────── */
        .topbar {
            height: 52px;
            min-height: 52px;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 20px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }
        .topbar-brand {
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .topbar-brand-dot {
            width: 7px; height: 7px;
            background: var(--accent);
            border-radius: 50%;
        }
        .topbar-sep { flex: 1; }
        .topbar-btn {
            display: flex; align-items: center; gap: 5px;
            padding: 5px 11px;
            font-size: 12px; font-weight: 500;
            color: var(--muted);
            background: transparent;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            cursor: pointer;
            text-decoration: none;
            font-family: inherit;
        }
        .topbar-btn svg { width: 13px; height: 13px; fill: currentColor; flex-shrink: 0; }

        /* ── Main layout ──────────────────────────────────────── */
        .workspace {
            flex: 1;
            display: grid;
            grid-template-columns: 260px 1fr;
            overflow: hidden;
        }

        /* ── Sidebar ──────────────────────────────────────────── */
        .sidebar {
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border);
            background: var(--surface);
            overflow: hidden;
        }
        .sidebar-search-wrap {
            padding: 12px;
            border-bottom: 1px solid var(--border);
            position: relative;
        }
        .sidebar-search-wrap svg {
            position: absolute;
            left: 22px; top: 50%;
            transform: translateY(-50%);
            width: 14px; height: 14px;
            fill: var(--subtle);
            pointer-events: none;
        }
        .sidebar-search {
            width: 100%;
            padding: 7px 10px 7px 32px;
            font-family: inherit;
            font-size: 13px;
            color: var(--text);
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            outline: none;
        }
        .sidebar-search::placeholder { color: var(--subtle); }
        .sidebar-search:focus { border-color: var(--accent); }

        .quick-pills {
            display: flex;
            gap: 5px;
            padding: 8px 12px;
            border-bottom: 1px solid var(--border);
            overflow-x: auto;
            scrollbar-width: none;
            flex-shrink: 0;
        }
        .quick-pills::-webkit-scrollbar { display: none; }
        .pill {
            padding: 4px 10px;
            font-size: 11px; font-weight: 500;
            color: var(--muted);
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            cursor: pointer;
            white-space: nowrap;
            font-family: inherit;
        }
        .pill:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-bg); }

        .index-list {
            flex: 1;
            overflow-y: auto;
            padding: 6px 8px;
        }
        .index-list::-webkit-scrollbar { width: 4px; }
        .index-list::-webkit-scrollbar-track { background: transparent; }
        .index-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

        .index-item {
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 8px 10px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            border: 1px solid transparent;
        }
        .index-item:hover { background: var(--bg); }
        .index-item.active { background: var(--accent-bg); border-color: var(--accent); }
        .index-item.active .item-name { color: var(--accent); }

        .item-dot {
            width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0;
        }
        .item-name { font-size: 13px; font-weight: 500; flex: 1; }
        .item-ref { font-size: 11px; color: var(--subtle); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 90px; }

        /* ── Detail panel ─────────────────────────────────────── */
        .detail {
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: var(--bg);
        }

        /* Breadcrumb */
        .breadcrumb {
            padding: 10px 24px;
            border-bottom: 1px solid var(--border);
            background: var(--surface);
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 12px;
            color: var(--subtle);
            flex-shrink: 0;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .breadcrumb::-webkit-scrollbar { display: none; }
        .bc-node {
            color: var(--muted);
            cursor: pointer;
            white-space: nowrap;
            font-weight: 500;
        }
        .bc-node:hover { color: var(--accent); }
        .bc-sep { color: var(--subtle); font-size: 10px; }

        /* Scroll area */
        .detail-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 28px 28px 40px;
            display: flex;
            gap: 28px;
        }
        .detail-scroll::-webkit-scrollbar { width: 5px; }
        .detail-scroll::-webkit-scrollbar-track { background: transparent; }
        .detail-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

        /* Left column */
        .left-col {
            width: 200px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .avatar-block {
            width: 200px; height: 200px;
            border-radius: var(--radius-md);
            overflow: hidden;
            background: var(--surface);
            border: 1px solid var(--border);
            position: relative;
            flex-shrink: 0;
        }
        .avatar-block img {
            width: 100%; height: 100%; object-fit: cover;
        }
        .avatar-placeholder {
            width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            font-size: 64px; font-weight: 700; color: rgba(255,255,255,0.9);
        }

        .meta-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            overflow: hidden;
        }
        .meta-row {
            display: flex;
            padding: 9px 14px;
            border-bottom: 1px solid var(--border);
            gap: 10px;
        }
        .meta-row:last-child { border-bottom: none; }
        .meta-key {
            font-size: 11px;
            font-weight: 600;
            color: var(--subtle);
            letter-spacing: .3px;
            text-transform: uppercase;
            width: 64px;
            flex-shrink: 0;
            padding-top: 1px;
        }
        .meta-val {
            font-size: 12.5px;
            font-weight: 500;
            color: var(--text);
            flex: 1;
            word-break: break-word;
        }
        .meta-val.link {
            color: var(--accent);
            cursor: pointer;
        }
        .meta-val.link:hover { text-decoration: underline; }

        /* Right column */
        .right-col {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .name-block { display: flex; flex-direction: column; gap: 4px; }
        .person-name {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
            line-height: 1.1;
        }
        .person-meaning {
            font-size: 13px;
            color: var(--muted);
            font-style: italic;
            padding-left: 10px;
            border-left: 2px solid var(--accent);
        }
        .action-row {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }

        .section-label {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: .6px;
            text-transform: uppercase;
            color: var(--subtle);
            margin-bottom: 8px;
        }

        /* Children grid */
        .children-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 6px;
        }
        .child-chip {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 9px 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .child-chip:hover { border-color: var(--accent); background: var(--accent-bg); }
        .child-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
        .child-info { min-width: 0; }
        .child-name { font-size: 12.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .child-sub { font-size: 10.5px; color: var(--subtle); }

        /* Notes */
        .notes-block {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 16px 18px;
        }
        .notes-text {
            font-size: 13.5px;
            line-height: 1.75;
            color: var(--muted);
        }

        /* Refs */
        .refs-wrap {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
        }
        .ref-chip {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 10px;
            font-size: 11.5px;
            font-weight: 500;
            border: 1px solid var(--border);
            border-radius: 20px;
            color: var(--muted);
            text-decoration: none;
            background: var(--surface);
        }
        .ref-chip.link { cursor: pointer; }
        .ref-chip.link:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-bg); }
        .ref-chip svg { width: 10px; height: 10px; fill: currentColor; }

        /* Empty / no-data */
        .no-data { font-size: 12px; color: var(--subtle); font-style: italic; }

        /* Empty state */
        .empty-state {
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            height: 100%; gap: 12px;
            color: var(--subtle);
        }
        .empty-state svg { width: 40px; height: 40px; fill: currentColor; opacity: .4; }
        .empty-state p { font-size: 13px; }
    </style>
</head>

    <script>
        const people = {};

        const localPatriarchDetails = {
            "Adam": {
                lugar: "Jardín del Edén",
                significado: "Derivado del hebreo «אָדָם» (adam), significa «hombre» o «humanidad»; también asociado con «tierra» o «suelo» (adamah), indicando que fue formado del polvo.",
                cruzada: "1 Crónicas 1 [Cruces: Adam: Génesis 1:26-27, 2:7, 5:1-5; Lucas 3:38; Romanos 5:12-21]",
                adicional: "Primer ser humano creado por Dios en el relato del Génesis. Colocado en el Edén, desobedece la orden divina comiendo del árbol prohibido junto a Eva y es expulsado. En el Nuevo Testamento es presentado como la cabeza federal de la humanidad caída, en contraste con Jesucristo (el postrer Adán)."
            },
            "Eva": {
                lugar: "Jardín del Edén",
                significado: "Del hebreo «חַוָּה» (Chavah), que significa «vida» o «madre de todos los vivientes».",
                cruzada: "Génesis 2:21-25, 3:1-20; 2 Corintios 11:3; 1 Timoteo 2:13",
                adicional: "Primera mujer, creada de la costilla de Adán. Seducida por la serpiente en la caída. Madre de Caín, Abel, Set y otros hijos."
            },
            "Set": {
                lugar: "Fuera del Edén",
                significado: "Del hebreo «שֵׁת» (Sheth), que significa «sustituto» o «designado».",
                cruzada: "1 Crónicas 1 [Cruces: Set: Génesis 4:25-26, 5:3-8; Lucas 3:38]",
                adicional: "Tercer hijo de Adán y Eva, nacido después de que Caín mató a Abel. De su línea desciende Noé y, eventualmente, la genealogía mesiánica."
            },
            "Noé": {
                lugar: "Tierra pre-diluviana / Mesopotamia",
                significado: "Del hebreo «נֹחַ» (Noach), que significa «descanso», «consuelo» o «alivio».",
                cruzada: "1 Crónicas 1 [Cruces: Noé: Génesis 5:28-32, caps. 6-9; Lucas 3:36; Hebreos 11:7; 2 Pedro 2:5]",
                adicional: "Hombre justo y perfecto en sus generaciones que halló gracia ante Dios. Construyó el arca para salvar a su familia y a las especies del Diluvio universal."
            },
            "Abraham": {
                lugar: "Ur de los Caldeos",
                significado: "Del hebreo «אַבְרָהָם» (Avraham), que significa «padre de multitudes». Originalmente Abram («padre enaltecido»).",
                cruzada: "1 Crónicas 1 [Cruces: Abraham: Génesis 11:26-32, caps. 12-25; Lucas 3:34; Romanos 4; Gálatas 3]",
                adicional: "Patriarca hebreo clave. Dios le ordenó salir de Ur de los Caldeos hacia Canaán y le prometió una descendencia incontable. Es el padre de la fe en la teología bíblica."
            },
            "Israel": {
                lugar: "Padan-aram",
                significado: "Del hebreo «יִשְׂרָאֵל» (Yisrael), que significa «el que lucha con Dios» o «príncipe de Dios». Originalmente Jacob («suplantador»).",
                cruzada: "1 Crónicas 2 [Cruces: Israel: Génesis 25-35, 46-50; Lucas 3:34; Romanos 9]",
                adicional: "Hijo de Isaac y Rebeca. Luchó con un ángel en Peniel y su nombre fue cambiado a Israel. Padre de las doce tribus de Israel."
            },
            "David": {
                lugar: "Belén",
                significado: "Del hebreo «דָּוִד» (David), que significa «amado».",
                cruzada: "1 Crónicas 3 [Cruces: David: 1 Samuel 16-31; 2 Samuel; Mateo 1; Lucas 3]",
                adicional: "Segundo rey de Israel unificado. Venció a Goliat, escribió gran parte de los Salmos, y recibió la promesa divina de que su trono permanecería para siempre, constituyendo la raíz mesiánica."
            },
            "Salomón": {
                lugar: "Jerusalén",
                significado: "Del hebreo «שְׁלֹמֹה» (Shlomoh), que significa «pacífico» o «paz».",
                cruzada: "1 Crónicas 3 [Cruces: Salomón: 2 Samuel 12:24; 1 Reyes 1-11; Mateo 1; 2 Crónicas 1-9]",
                adicional: "Hijo de David y Betsabé. Famoso por su inmensa sabiduría y por edificar el Primer Templo de Jerusalén. Al final de sus días cayó en la idolatría."
            }
        };

        function buildRelationshipMap() {
            if (typeof GENEALOGIA_DATA === 'undefined') return;
            function getOrCreate(name) {
                if (!name) return null;
                const n = name.trim();
                if (!n) return null;
                if (!people[n]) people[n] = { name:n, gender:"M", father:"", mother:"", birthPlace:"", spouses:new Set(), children:[], notes:"", reference:"", meaning:"" };
                return people[n];
            }
            GENEALOGIA_DATA.forEach(row => {
                const childName = row["Hijos"], fatherName = row["Padre"], motherName = row["Madre"];
                const child = getOrCreate(childName), father = getOrCreate(fatherName), mother = getOrCreate(motherName);
                if (child) {
                    if (fatherName) child.father = fatherName;
                    if (motherName) child.mother = motherName;
                    child.gender = row["Género Hijos"] || "M";
                    child.birthPlace = row["Lugar de nacimiento"] || "";
                    child.notes = row["Información Adicional"] || row["Notas"] || "";
                    child.reference = row["Referencia"] || "";
                }
                if (father && childName) {
                    father.children.push({ name:childName, gender:row["Género Hijos"]||"M", birthPlace:row["Lugar de nacimiento"]||"" });
                    if (motherName) { father.spouses.add(motherName); mother.spouses.add(fatherName); }
                }
                if (mother && childName) mother.children.push({ name:childName, gender:row["Género Hijos"]||"M", birthPlace:row["Lugar de nacimiento"]||"" });
                if (fatherName && row["Significado del Nombre (Padre)"]) father.meaning = row["Significado del Nombre (Padre)"];
            });
            Object.keys(localPatriarchDetails).forEach(name => {
                const local = localPatriarchDetails[name], p = getOrCreate(name);
                if (!p) return;
                if (local.lugar) p.birthPlace = local.lugar;
                if (local.significado) p.meaning = local.significado;
                if (local.adicional) p.notes = local.adicional;
                if (local.cruzada) p.reference = local.cruzada;
            });
        }

        function dotColor(name) {
            let h = 0;
            for (let i = 0; i < name.length; i++) h = name.charCodeAt(i) + ((h << 5) - h);
            return `hsl(${Math.abs(h % 360)}, 60%, 52%)`;
        }

        function avatarGradient(name) {
            let h = 0;
            for (let i = 0; i < name.length; i++) h = name.charCodeAt(i) + ((h << 5) - h);
            const h1 = Math.abs(h % 360), h2 = (h1 + 55) % 360;
            return `linear-gradient(135deg, hsl(${h1},65%,48%) 0%, hsl(${h2},65%,38%) 100%)`;
        }

        function getBibleUrl(ref) {
            if (!ref) return null;
            const m = ref.match(/([1-2]\s+)?([A-ZÁÉÍÓÚ][a-zñáéíóúü]+(?:\s+de\s+[a-zñáéíóúü]+)?)\s+(\d+)/i);
            if (!m) return null;
            const prefix = m[1] ? m[1].trim() + "-" : "";
            const book = m[2].trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, "-");
            if (prefix + book === "mateo" && m[3] === "24") return "https://btx4-juan.sociedadbiblicaiberoamericana.net/24-segun-mateo/c/0/i/23237365/capitulo-24";
            return null;
        }

        function getLineagePath(name) {
            const path = [], visited = new Set();
            let cur = people[name];
            while (cur && !visited.has(cur.name)) {
                path.unshift(cur.name);
                visited.add(cur.name);
                if (cur.name.toLowerCase() === "adam") break;
                cur = people[cur.father];
            }
            return path;
        }

        function selectPerson(name) {
            const p = people[name];
            if (!p) return;

            // Sidebar highlight
            document.querySelectorAll(".index-item").forEach(el => {
                el.classList.toggle("active", el.dataset.name === name);
                if (el.dataset.name === name) el.scrollIntoView({ block:"nearest" });
            });

            // Show columns
            document.getElementById("emptyState").style.display = "none";
            document.getElementById("leftCol").style.display = "flex";
            document.getElementById("rightCol").style.display = "flex";

            // Name & meaning
            document.getElementById("valName").textContent = p.name;
            document.getElementById("valMeaning").textContent = p.meaning || "Significado del nombre no registrado.";

            // Avatar
            const img = document.getElementById("portraitImg"), ph = document.getElementById("portraitPlaceholder");
            if (p.name.toLowerCase() === "adam") {
                img.src = "adam_portrait.png"; img.style.display = "block"; ph.style.display = "none";
            } else {
                img.style.display = "none"; ph.style.display = "flex";
                ph.textContent = p.name.charAt(0); ph.style.background = avatarGradient(p.name);
            }

            // Meta
            document.getElementById("valGender").textContent = p.gender === "M" ? "Masculino" : "Femenino";
            const fEl = document.getElementById("valFather");
            if (p.father) { fEl.textContent = p.father; fEl.className = "meta-val link"; fEl.onclick = () => selectPerson(p.father); }
            else { fEl.textContent = "—"; fEl.className = "meta-val"; fEl.onclick = null; }
            const mEl = document.getElementById("valMother");
            if (p.mother) { mEl.textContent = p.mother; mEl.className = "meta-val link"; mEl.onclick = () => selectPerson(p.mother); }
            else { mEl.textContent = "—"; mEl.className = "meta-val"; mEl.onclick = null; }
            const spouses = p.spouses.size > 0 ? Array.from(p.spouses).join(", ") : (p.name.toLowerCase() === "adam" ? "Eva" : "—");
            document.getElementById("valSpouse").textContent = spouses;
            document.getElementById("valBirthPlace").textContent = p.birthPlace || "—";

            // Children
            const grid = document.getElementById("childrenGrid");
            grid.innerHTML = "";
            let children = p.children;
            if (p.name.toLowerCase() === "adam" && children.length === 0)
                children = [{name:"Caín",gender:"M",birthPlace:""},{name:"Abel",gender:"M",birthPlace:""},{name:"Set",gender:"M",birthPlace:""}];
            if (children.length > 0) {
                children.forEach(c => {
                    const ch = document.createElement("div");
                    ch.className = "child-chip";
                    const color = c.gender.toLowerCase() === "f" ? "var(--f-dot)" : "var(--m-dot)";
                    const childObj = people[c.name];
                    const sub = childObj && childObj.children.length > 0 ? `${childObj.children.length} hijos` : (c.birthPlace || "");
                    ch.innerHTML = `<div class="child-dot" style="background:${color}"></div><div class="child-info"><div class="child-name">${c.name}</div>${sub ? `<div class="child-sub">${sub}</div>` : ""}</div>`;
                    ch.onclick = () => selectPerson(c.name);
                    grid.appendChild(ch);
                });
            } else {
                grid.innerHTML = `<span class="no-data">Sin descendientes registrados</span>`;
            }

            // Notes
            document.getElementById("valNotes").textContent = p.notes || "Sin información biográfica registrada.";

            // References
            const refsEl = document.getElementById("refsContainer");
            refsEl.innerHTML = "";
            if (p.reference) {
                const mainRef = p.reference.split("[")[0].trim();
                const crucesMatch = p.reference.match(/\[Cruces:\s*(.*)\]/);
                const makeChip = ref => {
                    const url = getBibleUrl(ref);
                    const el = document.createElement(url ? "a" : "span");
                    el.className = "ref-chip" + (url ? " link" : "");
                    if (url) { el.href = url; el.target = "_blank"; }
                    el.innerHTML = url ? `<svg viewBox="0 0 24 24"><path d="M19 19H5V5h7V3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z"/></svg>${ref}` : ref;
                    refsEl.appendChild(el);
                };
                makeChip(mainRef);
                if (crucesMatch && crucesMatch[1]) {
                    crucesMatch[1].split(";").forEach(c => {
                        const clean = c.replace(/^[A-ZÁÉÍÓÚ][a-zñáéíóúü]+:\s*/i, "").trim();
                        if (clean) makeChip(clean);
                    });
                }
            } else {
                refsEl.innerHTML = `<span class="no-data">Sin referencias registradas</span>`;
            }

            // Breadcrumb
            const bc = document.getElementById("breadcrumb");
            bc.innerHTML = "";
            const trail = getLineagePath(p.name);
            trail.forEach((n, i) => {
                const node = document.createElement("span");
                node.className = "bc-node"; node.textContent = n; node.onclick = () => selectPerson(n);
                bc.appendChild(node);
                if (i < trail.length - 1) { const sep = document.createElement("span"); sep.className = "bc-sep"; sep.textContent = "›"; bc.appendChild(sep); }
            });

            // Tree button
            const treeBtn = document.getElementById("viewInTreeBtn");
            if (treeBtn) {
                const root = trail.length > 0 ? trail[0] : "Adam";
                treeBtn.href = `arbol_genealogico.html?root=${encodeURIComponent(root)}&highlight=${encodeURIComponent(p.name)}`;
                treeBtn.style.display = "flex";
            }
        }

        function setupIndexList() {
            const list = document.getElementById("indexList");
            list.innerHTML = "";
            Object.keys(people).sort().forEach(name => {
                const p = people[name];
                const item = document.createElement("div");
                item.className = "index-item"; item.dataset.name = name;
                item.onclick = () => selectPerson(name);
                const ref = p.reference ? p.reference.split("[")[0].trim() : "";
                const color = p.gender === "F" ? "var(--f-dot)" : "var(--m-dot)";
                item.innerHTML = `<div class="item-dot" style="background:${color}"></div><span class="item-name">${name}</span>${ref ? `<span class="item-ref">${ref}</span>` : ""}`;
                list.appendChild(item);
            });
        }

        function setupSearch() {
            document.getElementById("searchInput").addEventListener("input", e => {
                const q = e.target.value.toLowerCase();
                document.querySelectorAll(".index-item").forEach(el => {
                    el.style.display = el.dataset.name.toLowerCase().includes(q) ? "flex" : "none";
                });
            });
        }

        function quickSelect(name) {
            if (people[name]) {
                selectPerson(name);
                document.getElementById("searchInput").value = "";
                document.querySelectorAll(".index-item").forEach(el => el.style.display = "flex");
            }
        }

        function setupTheme() {
            const toggle = document.getElementById("themeToggle");
            const sun = document.getElementById("sunIcon"), moon = document.getElementById("moonIcon");
            const apply = theme => {
                document.documentElement.setAttribute("data-theme", theme);
                sun.style.display = theme === "dark" ? "block" : "none";
                moon.style.display = theme === "dark" ? "none" : "block";
            };
            apply(localStorage.getItem("theme") || "light");
            toggle.addEventListener("click", () => {
                const next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
                localStorage.setItem("theme", next); apply(next);
            });
        }

        window.addEventListener("DOMContentLoaded", () => {
            buildRelationshipMap();
            setupIndexList();
            setupSearch();
            setupTheme();
            const params = new URLSearchParams(window.location.search);
            const nameParam = params.get("name");
            if (nameParam && people[nameParam]) selectPerson(nameParam);
            else if (people["Adam"]) selectPerson("Adam");
            else if (Object.keys(people).length > 0) selectPerson(Object.keys(people).sort()[0]);
        });
    </script>
</body>
